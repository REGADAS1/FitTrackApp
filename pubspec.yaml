name: fit_track_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  path_drawing: ^1.0.1
  flutter_bloc:
  hydrated_bloc:
  path_provider:
  firebase_core: ^3.12.1
  firebase_auth:
  get_it: 
  dartz:
  cloud_firestore:
  http:
  image_picker:
  fl_chart:
  intl:
  image_picker_web:
  syncfusion_flutter_calendar:
  syncfusion_flutter_datepicker:
  uuid:
  file_picker:
  shared_preferences:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1   # <--- adicionado para gerar ícones

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/
    - assets/fonts/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 600
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300

# Configuração para gerar os ícones da app
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/adpro_white.png"
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "assets/images/adpro_white.png"
